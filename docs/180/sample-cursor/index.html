<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame - Cursor</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere
        class="clickable"
        position="0 3 -3"
        radius="0.5"
        color="#4CC3D9"
        animation__mouseenter="property: material.color; to: #EF2D5E; startEvents: mouseenter"
        animation__mouseleave="property: material.color; to: #4CC3D9; startEvents: mouseleave"
      ></a-sphere>
      <a-camera>
        <a-cursor raycaster="objects: .clickable"></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
